<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krafty Menu</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>

  <!-- The English here is the fallback if the script does not run, and is
       also the source of the en messages; a test asserts the two still
       match, so the duplication cannot drift unnoticed.

       The five that open a panel take their label from that panel's own
       title key, so the menu and the panel cannot end up calling the same
       checker two different things. -->

  <!-- Two views, one shown at a time. Chrome cuts an action popup off at
       600px tall, and the menu with the QR under it measured 700px - the
       code a phone was meant to scan sat behind a scrollbar. -->
  <div id="js-menuView" class="view">

  <p class="checkerGroup" data-i18n="popupGroupReports">Report findings</p>

  <ul class="checkerList">
    <li><button type="button" id="js-headCheckButton" class="checkerButton headCheckButton" data-i18n="checkerHead">Head Check</button></li>
    <li><button type="button" id="js-nestCheckButton" class="checkerButton nestCheckButton" data-i18n="checkerNest">Nest Check</button></li>
    <li><button type="button" id="js-headingCheckButton" class="checkerButton headingCheckButton" data-i18n="checkerHeading">Heading Check</button></li>
    <li><button type="button" id="js-markupCheckButton" class="checkerButton markupCheckButton" data-i18n="checkerMarkup">Markup Check</button></li>
    <li><button type="button" id="js-imageCheckButton" class="checkerButton imageCheckButton" data-i18n="checkerImage">Image Check</button></li>
    <li><button type="button" id="js-leftoversCheckButton" class="checkerButton leftoversCheckButton" data-i18n="checkerLeftovers">Leftovers Check</button></li>
    <li><button type="button" id="js-landmarkCheckButton" class="checkerButton landmarkCheckButton" data-i18n="checkerLandmark">Landmark Check</button></li>
    <li><button type="button" id="js-tokenCheckButton" class="checkerButton tokenCheckButton" data-i18n="checkerToken">Token Check</button></li>
    <li><button type="button" id="js-tabCheckButton" class="checkerButton tabCheckButton" data-i18n="checkerTab">Tab Check</button></li>
    <li><button type="button" id="js-targetCheckButton" class="checkerButton targetCheckButton" data-i18n="checkerTarget">Target Check</button></li>
  </ul>

  <p class="checkerGroup" data-i18n="popupGroupOverlays">Show the page</p>

  <ul class="checkerList">
    <li><button type="button" id="js-outlineCheckButton" class="checkerButton outlineCheckButton" data-i18n="checkerOutline">Outline Check</button></li>
    <li><button type="button" id="js-altCheckButton" class="checkerButton altCheckButton" data-i18n="checkerAlt">alt Check</button></li>
    <li><button type="button" id="js-brightnessCheckButton" class="checkerButton brightnessCheckButton" data-i18n="checkerBrightness">Brightness Check</button></li>
    <li><button type="button" id="js-squintCheckButton" class="checkerButton squintCheckButton" data-i18n="checkerSquint">Squint Check</button></li>
    <li><button type="button" id="js-spacingCheckButton" class="checkerButton spacingCheckButton" data-i18n="checkerSpacing">Spacing Check</button></li>
    <li><button type="button" id="js-dummyCheckButton" class="checkerButton dummyCheckButton" data-i18n="checkerDummy">Dummy Check</button></li>
  </ul>

  <p class="reviewRow">
    <button type="button" id="js-reviewButton" class="reviewButton" data-i18n="popupReview">Copy the review</button>
  </p>

  <p class="qrOpenRow">
    <button type="button" id="js-qrOpenButton" class="qrOpenButton" data-i18n="popupGroupQr">Open on a phone</button>
  </p>

  <p id="js-status" class="status" role="status" hidden></p>

  </div>

  <!-- Item 25: not a checker. Needs only the tab URL, generated locally. -->
  <div id="js-qrView" class="view" hidden>
    <p class="qrBackRow">
      <button type="button" id="js-qrBackButton" class="qrBackButton" data-i18n="popupQrBack">Back</button>
    </p>

    <p class="checkerGroup" data-i18n="popupGroupQr">Open on a phone</p>

    <div class="qrBlock isEmpty" id="js-qrBlock">
      <canvas id="js-qrCanvas" class="qrCanvas" width="128" height="128" data-i18n-aria="popupQrLabel" aria-label="QR code of this page's address"></canvas>
      <p id="js-qrUrl" class="qrUrl"></p>
      <p id="js-qrEmpty" class="qrEmpty" data-i18n="popupQrUnavailable">No address to encode on this tab.</p>
    </div>
  </div>

  <script src="../checkers.js"></script>
  <script src="qr.js"></script>
  <script src="popup.js"></script>
</body>
</html>
